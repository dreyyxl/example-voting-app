apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app: vote
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: vote
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: vote
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: vote
          image: "{{ .Values.vote.image }}:{{ required "Set global.imageTag to the full commit SHA" .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.vote.containerPort }}
          env:
            - name: REDIS_HOST
              value: redis
