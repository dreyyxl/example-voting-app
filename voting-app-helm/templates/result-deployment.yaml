apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app: result
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: result
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: result
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: result
          image: "{{ .Values.result.image }}:{{ required "Set global.imageTag to the full commit SHA" .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.result.containerPort }}
          env:
            - name: DB_HOST
              value: db
