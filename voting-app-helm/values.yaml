global:
  imageTag: "e80149f" # Override with FULL Git commit SHA when deploying
  imagePullPolicy: IfNotPresent
vote:
  image: ghcr.io/dreyyxl/voting-vote
  replicas: 1
  containerPort: 80
  service:
    type: NodePort
    port: 5000
    nodePort: 31000
result:
  image: ghcr.io/dreyyxl/voting-result
  replicas: 1
  containerPort: 80
  service:
    type: NodePort
    port: 5001
    nodePort: 31001
worker:
  image: ghcr.io/dreyyxl/voting-worker
  replicas: 1
redis:
  image: redis:7-alpine # Pin to an approved digest before production
  port: 6379
db:
  image: postgres:15-alpine # Pin to an approved digest before production
  port: 5432
  database: postgres
  username: postgres
  existingSecret: voting-db-credentials
  passwordKey: password
  persistence:
    enabled: false # Ephemeral storage for LOCAL demonstration only
